[tool.poetry]
# --------------------------------------------------------------------------
# "Harnessing AI: The Craft of Shaping Agents"
#                   · 《驾驭工程：给 AI 套上缰绳》
# --------------------------------------------------------------------------
# This is the book's Python toolchain. It is intentionally kept separate
# from the repo-root pyproject.toml (which owns the lazy-ai-coder test
# suite) so the book can be built and linted from a clean environment
# with no Go/backend test deps.
#
# Quick start from the repo root:
#
#     make book-install     # poetry install (uses the book/ pyproject)
#     make book-html        # sphinx-build (strict)
#     make book-lint        # structural + bibliography checks
#
# Every target routes through `poetry run` so the book toolchain never
# pollutes the user's global Python or the repo-root Poetry env.
# --------------------------------------------------------------------------
name = "harnessing-ai-book"
version = "0.1.0"
description = "Sphinx build toolchain for 'Harnessing AI: The Craft of Shaping Agents' / 《驾驭工程：给 AI 套上缰绳》"
authors = ["Walter Fan"]
license = "CC-BY-SA-4.0"
readme = "README.md"
# Not a distributable package — prevents poetry from trying to build a wheel
# and keeps install fast.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# All lower bounds match what the original requirements-docs.txt pinned; the
# compatible-release cap prevents silent major-version jumps.
Sphinx = "~=8.1"
myst-parser = "~=4.0"
sphinx-rtd-theme = "~=3.0"
sphinx-copybutton = "~=0.5"
sphinx-design = "~=0.6"
sphinxcontrib-mermaid = "~=1.0"
sphinxcontrib-plantuml = "~=0.30"
sphinxcontrib-bibtex = "~=2.6"

[tool.poetry.group.dev.dependencies]
# sphinx-autobuild powers the interactive live-preview target.
sphinx-autobuild = "~=2024.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
