name: publish

# Pre-publish validation. The actual GitHub Pages deploy is done from the
# laptop via `make publish`, which force-pushes build/html/ to the gh-pages
# branch (see Makefile). This workflow only re-validates that the book still
# lints and builds clean on a stock Ubuntu runner so we catch toolchain drift
# between local and CI before it reaches a publish.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.5
          poetry --version

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: book-venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            book-venv-${{ runner.os }}-py312-

      - name: Install book toolchain
        run: make install

      - name: Run book-lint
        run: make lint

      - name: Build HTML
        run: make html
